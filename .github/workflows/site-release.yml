name: site-release

# Publishing a release is the gate: the tag builds a draft, the maintainer checks
# the image, and only then does the release go public and the site say the version
# exists (the LuCI upgrade notice reads .versions.json there). The dispatch form
# repeats the site half for a release whose event was missed or failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to write to the site, e.g. 25.12.5-rc2 (its release must be published)"
        required: true
        type: string

permissions:
  contents: read

# The same group as the docs publish job: the two never write gh-pages at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The release's tag
        id: tag
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_VER: ${{ inputs.version }}
        run: |
          set -eu
          if [ -n "$REL_TAG" ]; then
            tag="$REL_TAG"
          else
            tag="v$IN_VER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: The tag is this tree's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          ver=$(sed -n 's/^CW_VERSION="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          [ "$TAG" = "v$ver" ] || { echo "the release tag $TAG is not v$ver (tools/cw-release-build.sh)"; exit 1; }
          echo "== site update for $TAG =="

      - name: profiles.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "$TAG" --pattern profiles.json --dir dist
          [ -s dist/profiles.json ]

      - name: Update the site (gh-pages)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          git config user.name "Pr0Luci"
          git config user.email "Pr0Luci@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q origin gh-pages
            git worktree add -q ../site FETCH_HEAD
            git -C ../site checkout -q -B gh-pages
          else
            git worktree add -q --detach ../site
            git -C ../site checkout -q --orphan gh-pages
            git -C ../site rm -rqf . || true
          fi
          sh tools/cw-site-update.sh ../site "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" dist/profiles.json
          git -C ../site add -A
          git -C ../site commit -q -m "Site: CleanWRT $VERSION" || { echo "nothing to commit"; exit 0; }
          git -C ../site push -q origin gh-pages

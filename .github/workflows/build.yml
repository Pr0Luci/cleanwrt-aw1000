name: build

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Rebuild all packages (make clean) instead of an incremental build"
        type: boolean
        default: false
      opt_artifacts:
        description: "Also compile and verify the optional cw-opt apk feed (needs the signing key secret)"
        type: boolean
        default: false
      artifacts:
        description: "Upload the images as a workflow artifact (public repository: anyone signed in to GitHub can download it)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  CW_MAX_IMAGE_MB: "130"

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # The tag run uploads the images straight into a draft release from here: a
    # workflow artifact is downloadable by anyone signed in, which would bypass
    # the draft gate. Workflow-dispatch runs stay read-only in effect.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          ver=$(sed -n 's/^CW_VERSION="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          tag=$(sed -n 's/^OPENWRT_TAG="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*) [ "${GITHUB_REF#refs/tags/v}" = "$ver" ] || { echo "tag does not match CW_VERSION $ver"; exit 1; } ;;
          esac

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          sudo mkdir -p /mnt/cw && sudo chown "$USER" /mnt/cw
          df -h / /mnt

      - name: Builder image
        run: docker build -t cleanwrt-builder docker/

      - name: OpenWrt tree at the pinned tag
        run: |
          tag=$(sed -n 's/^OPENWRT_TAG="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          git clone --depth 1 --branch "$tag" https://github.com/openwrt/openwrt.git /mnt/cw/openwrt

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/cw/openwrt/dl
            /mnt/cw/openwrt/.ccache
          # The tree tag is part of the key: a compiler cache built against another OpenWrt
          # release is not a cache for this one, and no cache is cheaper than a wrong one.
          key: cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-${{ github.run_id }}
          restore-keys: |
            cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-

      - name: Signing keys (optional repository secrets)
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          USIGN_KEY_BUILD: ${{ secrets.USIGN_KEY_BUILD }}
          USIGN_KEY_BUILD_PUB: ${{ secrets.USIGN_KEY_BUILD_PUB }}
        run: |
          set -eu
          if [ -n "$APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_PRIVATE_KEY" > /mnt/cw/openwrt/private-key.pem
            echo "apk feed signing key: restored from secret"
          else
            echo "apk feed signing key: none (the tree creates a throw-away key; the cw-opt feed stays disabled)"
          fi
          if [ -n "$USIGN_KEY_BUILD" ] && [ -n "$USIGN_KEY_BUILD_PUB" ]; then
            umask 077
            mkdir -p keys-release
            printf '%s\n' "$USIGN_KEY_BUILD" > keys-release/key-build
            printf '%s\n' "$USIGN_KEY_BUILD_PUB" > keys-release/key-build.pub
            echo "image signing key: restored from secret"
          else
            echo "image signing key: none (images are not signed)"
          fi

      - name: Build
        id: build
        timeout-minutes: 335
        env:
          CW_CCACHE: "1"
          CW_BUILD_OPT_ARTIFACTS: ${{ inputs.opt_artifacts && '1' || '0' }}
          CW_REQUIRE_RELEASE_KEYS: ${{ (inputs.opt_artifacts && secrets.APK_PRIVATE_KEY != '') && '1' || '0' }}
        run: |
          set -o pipefail
          flag=""
          [ "${{ inputs.clean }}" = "true" ] && flag="--clean"
          docker run --rm \
            -e CW_CCACHE -e CW_BUILD_OPT_ARTIFACTS -e CW_REQUIRE_RELEASE_KEYS -e CW_MAX_IMAGE_MB \
            -v /mnt/cw/openwrt:/build -v "$PWD":/cleanwrt \
            cleanwrt-builder /cleanwrt/tools/cw-release-build.sh /build $flag 2>&1 | tee /mnt/cw/build.log

      - name: Compiler cache statistics
        if: always()
        run: |
          if [ -x /mnt/cw/openwrt/staging_dir/host/bin/ccache ]; then
            CCACHE_DIR=/mnt/cw/openwrt/.ccache /mnt/cw/openwrt/staging_dir/host/bin/ccache -s
          fi
          du -sh /mnt/cw/openwrt/dl /mnt/cw/openwrt/.ccache 2>/dev/null || true
          df -h /mnt

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/cw/openwrt/dl
            /mnt/cw/openwrt/.ccache
          key: cw-${{ steps.ver.outputs.tag }}-${{ hashFiles('feeds.conf.default', 'configs/**') }}-${{ github.run_id }}

      - name: Collect release files
        if: success()
        run: |
          set -eu
          OUT=/mnt/cw/openwrt/bin/targets/qualcommax/ipq807x
          mkdir -p dist
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*arcadyan_aw1000*' -o -name '*.manifest' -o -name 'profiles.json' \
               -o -name 'sha256sums*' -o -name '*.buildinfo' \) -exec cp {} dist/ \;
          cp -r "$OUT/cw-release-provenance" dist/cw-release-provenance
          tar -C dist -czf dist/provenance.tar.gz cw-release-provenance && rm -rf dist/cw-release-provenance
          # sha256sums.cw names the paths inside the bundle. A bundle that unpacks under a
          # different directory cannot be verified with it, so the two are proved to agree
          # here, before anything reaches the release page.
          chk=$(mktemp -d)
          tar -xzf dist/provenance.tar.gz -C "$chk"
          grep 'cw-release-provenance' dist/sha256sums.cw > "$chk/provenance-only.txt"
          ( cd "$chk" && sha256sum -c provenance-only.txt ) || { echo "ERROR: sha256sums.cw does not match the provenance bundle" >&2; rm -rf "$chk"; exit 1; }
          rm -rf "$chk"
          ls -l dist
          # every image the release page promises must actually be in dist/
          for pat in '*arcadyan_aw1000-squashfs-sysupgrade.bin' \
                     '*arcadyan_aw1000-squashfs-factory.ubi' \
                     '*arcadyan_aw1000-initramfs-uImage.itb'; do
              compgen -G "dist/$pat" > /dev/null || { echo "ERROR: no file matches $pat" >&2; exit 1; }
          done
          # The three image hashes in the log: two runs of one commit can be compared from the
          # summary alone, with nothing downloaded.
          sha256sum dist/*.bin dist/*.ubi dist/*.itb

      - name: Optional cw-opt feed
        if: success() && inputs.opt_artifacts
        run: |
          docker run --rm -v /mnt/cw/openwrt:/build -v "$PWD":/cleanwrt cleanwrt-builder \
            /cleanwrt/tools/cw-publish-feed.sh /build --out /cleanwrt/feed-out
          tar -C feed-out -czf dist/cw-opt-feed.tar.gz .

      - name: Draft release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          pre=""
          case "$VERSION" in *-rc*) pre="--prerelease" ;; esac
          cat > notes.md <<NOTES
          CleanWRT $VERSION for the Arcadyan AW1000 (OpenWrt ${{ steps.ver.outputs.tag }}, qualcommax/ipq807x).

          Flash the \`*-squashfs-sysupgrade.bin\` with sysupgrade, see the README for the
          required expanded MTD layout. \`sha256sums.cw\` lists the checksums of the images and
          the provenance bundle; \`provenance.tar.gz\` holds the full config, the pinned feeds and
          the package manifest of this build. Built from commit $GITHUB_SHA.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            # a re-run refreshes the draft; a published release stays as it was
            # published (the site and the LuCI check point at those bytes)
            [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ] ||
              { echo "ERROR: $tag is published already; a tag build never rewrites it" >&2; exit 1; }
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "CleanWRT $VERSION" --notes-file notes.md $pre
          fi

      - name: Upload build files
        if: success() && inputs.artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanwrt-${{ steps.ver.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /mnt/cw/build.log
          retention-days: 14
          if-no-files-found: ignore

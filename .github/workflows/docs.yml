name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site-root/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs-hooks.py"
      - "configs/arcadyan_aw1000.seed"
  pull_request:
    paths:
      - "docs/**"
      - "site-root/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs-hooks.py"
      - "configs/arcadyan_aw1000.seed"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build (broken links fail the build)
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict -d site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: built
      - name: Publish to gh-pages under docs/
        run: |
          set -eu
          git config user.name "Pr0Luci"
          git config user.email "Pr0Luci@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q origin gh-pages
            git worktree add -q ../site FETCH_HEAD
            git -C ../site checkout -q -B gh-pages
          else
            git worktree add -q --detach ../site
            git -C ../site checkout -q --orphan gh-pages
            git -C ../site rm -rqf . || true
          fi
          mkdir -p ../site/docs
          rsync -a --delete built/ ../site/docs/
          touch ../site/.nojekyll
          [ -d site-root ] && cp -f site-root/* ../site/
          [ -f ../site/index.html ] || cat > ../site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=docs/">
          <title>CleanWRT</title>
          <a href="docs/">CleanWRT documentation</a>
          HTML
          git -C ../site add -A
          git -C ../site commit -q -m "Docs: $GITHUB_SHA" || { echo "nothing to commit"; exit 0; }
          git -C ../site push -q origin gh-pages

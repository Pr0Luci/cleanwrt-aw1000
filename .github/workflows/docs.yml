name: docs

# The documentation site and the version list the router's upgrade notice reads are written by
# this one workflow: both land on gh-pages, so they share the fetch, the worktree and the push
# instead of carrying two copies of them.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site-root/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs-hooks.py"
      - "tools/cw-site-update.sh"
      - "configs/arcadyan_aw1000.seed"
  pull_request:
    paths:
      - "docs/**"
      - "site-root/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "tools/docs-hooks.py"
      - "tools/cw-site-update.sh"
      - "configs/arcadyan_aw1000.seed"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Write this published version to the site instead, e.g. 25.12.5-rc2"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build (broken links fail the build)
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict -d site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 3

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # one group for everything that writes gh-pages: the two jobs never push at the same time
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: built
      - name: Publish to gh-pages under docs/
        run: |
          set -eu
          sh tools/cw-gh-pages.sh prepare ../site
          mkdir -p ../site/docs
          rsync -a --delete built/ ../site/docs/
          touch ../site/.nojekyll
          if [ -d site-root ]; then cp -f site-root/* ../site/; fi
          [ -f ../site/index.html ] || cat > ../site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=docs/">
          <title>CleanWRT</title>
          <a href="docs/">CleanWRT documentation</a>
          HTML
          sh tools/cw-gh-pages.sh commit ../site "Docs: $GITHUB_SHA"

  versions:
    # Publishing a release is the gate: the tag builds a draft, the image is checked, and only
    # then does the release go public and the site say the version exists - the router's upgrade
    # notice reads .versions.json there. Dispatch repeats this half for a release whose event
    # was missed or failed.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: The release's tag
        id: tag
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          IN_VER: ${{ inputs.version }}
        run: |
          set -eu
          tag="${REL_TAG:-v$IN_VER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: The tag is this tree's version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          ver=$(sed -n 's/^CW_VERSION="\(.*\)"$/\1/p' tools/cw-release-build.sh)
          [ "$TAG" = "v$ver" ] || { echo "the release tag $TAG is not v$ver (tools/cw-release-build.sh)"; exit 1; }
          echo "== site update for $TAG =="

      - name: profiles.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          gh release download "$TAG" --pattern profiles.json --dir dist
          [ -s dist/profiles.json ]

      - name: Update the site (gh-pages)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          sh tools/cw-gh-pages.sh prepare ../site
          sh tools/cw-site-update.sh ../site "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" dist/profiles.json
          sh tools/cw-gh-pages.sh commit ../site "Site: CleanWRT $VERSION"
